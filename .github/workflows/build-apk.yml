name: Build Ramlal Maharaj Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - build/real-devotional-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: ramlal_maharaj_app
        run: flutter pub get

      - name: Check formatting
        working-directory: ramlal_maharaj_app
        run: dart format --output=none --set-exit-if-changed lib

      - name: Build Android APK
        working-directory: ramlal_maharaj_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ramlal-Maharaj-APK
          path: ramlal_maharaj_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
